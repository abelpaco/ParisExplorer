fr:
  title: "Montmartre : la colline qui n'a jamais vraiment rejoint Paris"
  subtitle: "Plâtre, moulins, peintres et une vigne en pleine ville"
  narration: |
    À Paris, il existe une colline où l'on fait encore les vendanges.

    Montmartre culmine à un peu plus de cent trente mètres. C'est le point
    naturel le plus élevé de la ville. Ailleurs, ce serait une bosse. Dans une
    capitale posée sur une plaine, c'est un événement.

    D'où vient le nom ? Deux pistes, et les historiens n'ont jamais tranché. Mons
    Martis, le mont de Mars, en souvenir d'un temple romain. Ou mons Martyrum, le
    mont des martyrs, en mémoire de Denis, premier évêque de Paris, décapité sur
    ces pentes selon la tradition. La légende ajoute qu'il aurait ramassé sa tête
    et continué à marcher. Cela n'aide pas à choisir, mais cela se retient.

    Longtemps, la butte est d'abord un lieu de travail. Son sous-sol est plein de
    gypse. On l'extrait, on le cuit, on en fait du plâtre : ce fameux plâtre de
    Paris. Sur la crête, des moulins broient la pierre et le grain. Il en reste
    deux debout aujourd'hui.

    Jusqu'en 1860, Montmartre n'est pas Paris. C'est une commune indépendante,
    située hors du mur des Fermiers généraux, donc hors de la taxe sur le vin. On
    y boit moins cher qu'en bas. Les guinguettes se remplissent. Quand Napoléon
    III annexe le village, la ville hérite d'un quartier de loyers bas et
    d'ateliers mal chauffés.

    Alors les peintres montent. Renoir plante son chevalet au Moulin de la
    Galette en 1876. Van Gogh loge rue Lepic, chez son frère Theo. Et dans une
    bâtisse de bois surnommée le Bateau-Lavoir, un Espagnol de vingt-cinq ans
    peint en 1907 une toile qui fera basculer la peinture européenne : Picasso,
    et ses Demoiselles d'Avignon.

    Entre-temps, la colline a saigné. Le 18 mars 1871, l'armée vient récupérer
    les canons entreposés sur la butte. La foule s'interpose. La Commune de Paris
    commence là, ce matin-là.

    Le Sacré-Cœur naît en partie de cette blessure. Commencée en 1875, la
    basilique n'est achevée qu'en 1914. Sa pierre a une particularité : elle
    blanchit sous la pluie. Le monument se relave tout seul.

    Et la vigne ? Elle a été plantée en 1933, sur un terrain que des promoteurs
    convoitaient. Sa récolte est minuscule, et fêtée chaque automne.

    Un village qui a refusé de descendre. C'est peut-être la meilleure définition
    de Montmartre.
