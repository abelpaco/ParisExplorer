fr:
  title: "Notre-Dame a été sauvée par un roman"
  subtitle: "Huit siècles, une ruine, une restauration contestée"
  narration: |
    Au début du XIXᵉ siècle, on envisage sérieusement de démolir Notre-Dame. Ce
    qui la sauve n'est ni un roi, ni un architecte. C'est un livre.

    Le chantier avait commencé en 1163. Il durera près de deux cents ans. La
    cathédrale invente, ou perfectionne, ce qui fera le gothique : des voûtes plus
    hautes, des murs percés de verrières immenses, et surtout des arcs-boutants
    qui reprennent la poussée à l'extérieur. C'est ce qui permet d'ouvrir les murs
    sans que tout s'écroule. La lumière entre parce que la structure a été
    déplacée dehors.

    Sur le parvis, une dalle de bronze marque le point zéro des routes de France.
    Toutes les distances routières du pays se comptent depuis là. Notre-Dame
    n'est pas seulement au centre de Paris : elle est l'origine de la carte.

    Il manque d'ailleurs quelque chose à la façade, et presque personne ne le
    remarque. Les deux tours devaient recevoir des flèches. Elles n'ont jamais
    été construites. La silhouette carrée qu'on connaît est un chantier
    inachevé.

    Puis les siècles passent, et l'entretien ne suit pas. La Révolution s'en
    prend aux statues : les vingt-huit rois de la façade sont décapités, pris pour
    des rois de France alors qu'ils représentaient des rois de Juda. Le bâtiment
    sert un temps d'entrepôt. Vers 1830, il est dans un état lamentable.

    En 1831, Victor Hugo publie Notre-Dame de Paris. Le roman est un succès
    immense, et il fait quelque chose d'inattendu : il rend la cathédrale
    populaire. L'opinion se retourne. Une souscription est lancée.

    La restauration est confiée à Viollet-le-Duc. Elle durera vingt ans, et elle
    reste discutée aujourd'hui. Car il ne s'est pas contenté de réparer : il a
    complété, corrigé, imaginé. La flèche n'était pas médiévale, c'est la sienne.
    Les chimères qui regardent Paris depuis les tours non plus : elles datent du
    XIXᵉ siècle. Sa doctrine était assumée — restaurer, disait-il, c'est rétablir
    un édifice dans un état complet qui peut n'avoir jamais existé.

    Le 15 avril 2019, l'incendie emporte la charpente et la flèche. La structure
    de pierre, elle, tient. Les arcs-boutants ont fait leur travail une dernière
    fois.

    Ce qui a brûlé cette nuit-là, ce n'était donc pas le Moyen Âge. C'était le
    XIXᵉ siècle — l'œuvre d'un homme qui avait déjà sauvé le bâtiment une fois.
  cards:
    - "Au XIXᵉ siècle, on envisage sérieusement de démolir Notre-Dame."
    - "Ce qui la sauve n'est ni un roi ni un architecte : c'est un roman de Victor Hugo."
    - "La lumière entre parce que la structure a été déplacée dehors, en arcs-boutants."
    - "La flèche n'était pas médiévale. Elle datait du XIXᵉ siècle."
    - "En 2019, ce qui a brûlé n'était pas le Moyen Âge, mais une restauration."
