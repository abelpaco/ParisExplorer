  - Le mot n'apparait pourtant par ecrit qu'en 1884, ce qui rend cette origine tres
    incertaine pour les linguistes.
  - D'autres pistes existent, comme le mot regional bistraud, sans qu'aucune ne soit
    prouvee avec certitude.
