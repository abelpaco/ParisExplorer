en:
  title: "The Statue of Liberty Was Born in Paris"
  subtitle: "For months, a copper giant loomed over the rooftops of the 17th arrondissement"
  narration: |
    New York's most famous silhouette was born in Paris.
    In the 1880s, a copper giant rises above the rooftops of the 17th arrondissement. It is not a mirage. It is a construction site. Auguste Bartholdi has designed a colossal statue, and it is taking shape in the middle of Paris, in the Gaget-Gauthier workshops. Its internal framework bears the signature of an engineer named Eiffel. Yes, that one.
    For months, Parisians live alongside her. You look up from the street, and Liberty towers over the buildings. People even visit the workshop, the way you would visit an attraction. The most American statue in the world is, for now, a Parisian curiosity — an oversized neighbor that an entire district watches grow, week after week.
    Then comes the departure. In 1885, the giant is taken apart and packed into 214 crates. Destination: New York. Paris built Liberty. America will raise her to face the ocean.
    But Paris did not give everything back.
    On the Île aux Cygnes, a narrow strip of land in the middle of the Seine, stands a Statue of Liberty of her own — 11.5 meters tall, offered in 1889 by the American community of Paris. A return gift, in a way: you gave us the big one, here is the little one. Since the 1937 Exposition, she has faced west. Toward her big sister. The two statues look at each other across an entire ocean, aligned by a single gaze.
    And she is not alone. In the Luxembourg Gardens, a model of the statue watches over the strollers. At the Musée d'Orsay, yet another. Paris is scattered with Liberties, like artist's proofs kept close to the original studio. The city that built the statue kept copies for itself — discreet, almost confidential. Most passersby no longer even notice them.
    So the next time the Statue of Liberty appears in a photo of New York, remember this. Before towering over an American bay, this giant towered over Parisian rooftops. Passersby watched her being born, watched her grow, then watched her leave, crate after crate. The most famous New Yorker in the world is an expatriate. And on the Seine, an 11.5-meter little sister salutes her, facing west, faithfully at her post since 1937.
  tags: [Statue of Liberty, Bartholdi, Île aux Cygnes, Eiffel, Paris, hidden Paris]
