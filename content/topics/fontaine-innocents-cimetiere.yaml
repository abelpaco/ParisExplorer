fr:
  title: Cette fontaine Renaissance repose sur les restes de deux millions de morts
  subtitle: Le plus vieux cimetiere de Paris disparu sous une place
  narration: 'Une fontaine du seizieme siecle trone aujourd''hui sur l''emplacement
    du cimetiere le plus charge de l''histoire de Paris. Le cimetiere des Innocents
    fonctionne pendant environ huit cents ans, depuis le haut Moyen Age jusqu''en
    1780. Il dessert les paroisses du centre de Paris, dans le quartier des Halles.


    Le probleme, c''est qu''un cimetiere concu pour un village medieval doit absorber
    des siecles de morts d''une capitale en expansion. Les fosses communes s''empilent.
    Au dix-huitieme siecle, le terrain est surelevè de plusieurs metres par l''accumulation
    des corps. Les habitants du quartier se plaignent d''odeurs pestilentielles. En
    1780, un mur du cimetiere s''effondre carrement dans la cave d''un immeuble voisin,
    laissant s''echapper des cadavres en decomposition.


    L''evenement declenche une decision radicale. Le roi Louis XVI ordonne la fermeture
    definitive du cimetiere. Entre 1786 et 1788, des millions d''ossements sont exhumes
    de nuit, transportes par charrette a travers Paris, et deposes dans d''anciennes
    carrieres souterraines au sud de la ville. C''est la naissance des Catacombes.


    Sur l''emplacement du cimetiere vide, la ville amenage une place. La fontaine
    des Innocents, elle, existait deja avant la destruction du cimetiere : construite
    en 1549 par l''architecte Pierre Lescot et le sculpteur Jean Goujon, elle ornait
    a l''origine un angle de rue, adossee a un mur. Elle est deplacee au centre de
    la nouvelle place en 1788, reconstituee sur ses quatre faces pour la premiere
    fois.


    Aujourd''hui, les touristes prennent des photos devant ses bas-reliefs de nymphes
    sans savoir qu''ils se tiennent exactement au-dessus du sol qui, pendant huit
    siecles, a absorbe les morts de tout un quartier de Paris.

    '
  tags:
  - cimetiere
  - renaissance
  - les halles
  cards:
  - Le cimetiere des Innocents a fonctionne pendant environ huit cents ans, jusqu'a
