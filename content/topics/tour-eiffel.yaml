fr:
  title: "La Tour Eiffel devait être démontée : pourquoi elle est toujours là"
  subtitle: "Histoire d'un monument construit pour vingt ans"
  narration: |
    Elle devait disparaître au bout de vingt ans.

    En 1889, la France prépare une Exposition universelle. Le pays veut fêter le
    centenaire de la Révolution et montrer ce que ses usines savent faire. Il lui
    faut un geste. Deux ingénieurs du bureau d'études de Gustave Eiffel, Maurice
    Koechlin et Émile Nouguier, dessinent un pylône de fer de trois cents mètres.
    Eiffel est tiède, au début. Puis il achète l'idée et la défend. L'architecte
    Stephen Sauvestre ajoute les grandes arches décoratives, et le projet devient
    une silhouette.

    Le chantier commence au Champ-de-Mars en janvier 1887. Il durera un peu plus
    de deux ans. Tout est réglé sur le papier avant d'être réglé sur le terrain :
    environ dix-huit mille pièces de fer, dessinées une à une, tenues par deux
    millions et demi de rivets. Les pièces arrivent des ateliers d'Eiffel, à
    Levallois-Perret, déjà percées. Sur place, il n'y a presque rien à corriger.

    Paris, lui, n'est pas conquis. En février 1887, une pétition paraît dans la
    presse. Des écrivains, des peintres, des musiciens dénoncent une odieuse
    colonne de tôle boulonnée. Maupassant signe. Charles Garnier, l'architecte de
    l'Opéra, signe aussi. On parle de lampadaire géant, de cheminée d'usine, de
    squelette.

    Le 31 mars 1889, Eiffel monte au sommet et y plante un drapeau tricolore. La
    tour est alors la construction la plus haute du monde. Elle gardera ce record
    pendant plus de quarante ans.

    Reste un détail administratif. La concession court sur vingt ans. Passé 1909,
    la Ville peut la démonter et vendre le fer. Ce qui la sauve, ce n'est pas
    l'affection des Parisiens. C'est une antenne. Eiffel installe au sommet des
    expériences de télégraphie sans fil, et l'armée y voit tout de suite son
    intérêt. La tour devient un outil : un émetteur pour les signaux, puis pour
    la radio, puis pour la télévision. On ne démonte pas un instrument qui sert.

    Aujourd'hui, elle culmine à environ trois cent trente mètres, antennes
    comprises. On la repeint à la main, régulièrement, par dizaines de tonnes de
    peinture. Et le fer travaille : par forte chaleur, le sommet se déplace de
    quelques centimètres. Chaque année, plusieurs millions de visiteurs grimpent
    dans un décor d'exposition temporaire pour regarder Paris.

    Le monument le plus reconnaissable de France n'était pas fait pour durer.
    Personne n'a jamais osé y toucher.
