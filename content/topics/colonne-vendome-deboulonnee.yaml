fr:
  title: Un peintre celebre a fait tomber une colonne monumentale, puis a paye pour
    ca toute sa vie
  subtitle: Gustave Courbet et la chute de la colonne Vendome
  narration: 'Une colonne haute de quarante-quatre metres s''effondre en morceaux
    sur une place parisienne, filmee par les photographes de l''epoque. Le 16 mai
    1871, en pleine Commune de Paris, la colonne Vendome est abattue devant une foule
    nombreuse. Erigee sous Napoleon Ier avec le bronze des canons pris a l''ennemi
    a Austerlitz, elle est percue par les communards comme un symbole de guerre et
    de despotisme militaire.


    Gustave Courbet, le peintre celebre pour "L''Origine du monde" et "Un enterrement
    a Ornans", preside a l''epoque la Federation des artistes sous la Commune. Il
    avait propose des 1870, avant meme l''insurrection, de demonter la colonne pour
    la remplacer par un monument dedie a la paix. Quand la Commune decide sa destruction
    en 1871, Courbet est present, mais des historiens debattent encore de son role
    exact dans la decision et l''execution.


    La chute est spectaculaire. La colonne se brise en plusieurs tronçons sur des
    fascines de fumier disposees pour amortir le choc. La statue de Napoleon au sommet
    se detache separement.


    Apres l''ecrasement de la Commune quelques semaines plus tard, la repression s''abat.
    Courbet est arrete, emprisonne six mois. Puis, en 1873, l''Etat francais le tient
    pour responsable financier de la destruction et le condamne a payer la reconstruction
    integrale de la colonne, soit un montant considerable, environ trois cent mille
    francs de l''epoque, a regler en versements annuels pendant des annees.


    Courbet choisit l''exil plutot que la ruine. Il part en Suisse en 1873 et y meurt
    en 1877, l''annee meme ou le premier versement etait du. La colonne, elle, est
    reconstruite a l''identique des 1875 et se dresse toujours place Vendome aujourd''hui.

    '
