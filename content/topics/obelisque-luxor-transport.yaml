en:
  title: "It Took Two Years to Bring a 3,000-Year-Old Obelisk to Paris"
  subtitle: "The logistical ordeal behind Mehemet Ali's royal gift"
  narration: |
    A ship gets built for one job only: hauling a single piece of stone.
    In 1830, Egypt's viceroy Mehemet Ali offers France one of the two obelisks
    standing at the Luxor temple. The gift weighs two hundred and thirty tons.
    No existing ship can carry it.

    Engineer Apollinaire Lebas designs a flat-bottomed vessel named the Luxor.
    It gets built specially at Le Havre, with a bow that opens to let the
    obelisk slide in lying down.

    The journey starts in 1831. The Luxor sails up the Nile, waits for the
    flood season to break free of the sandbanks, crosses the Mediterranean,
    then sails up the Seine. The whole operation takes more than two years.
    Local workers help free the monument from its base at Luxor, where it
    had stood upright for over three thousand years.

    The obelisk reaches Paris in 1833, but it takes three more years to
    figure out how to raise it without cracking it. The work happens at
    place de la Concorde, right under the eyes of King Louis-Philippe. On
    October 25th, 1836, more than one hundred thousand Parisians watch the
    lift. Ropes, giant pulleys, and hundreds of workers hoist the stone
    upright in barely over an hour, in tense silence: nobody knows if the
    monument will hold.

    It holds. Ever since, the Luxor obelisk has stood at place de la
    Concorde, on the exact spot where the guillotine once operated during
    the Revolution. Its hieroglyphs tell the story of Ramses II's reign,
    but almost no Parisian ever reads them.

    The temple's second obelisk never left Egypt. France gave up its claim
    to it in 1981, officially returning it to the country that had offered
    it a century and a half earlier.
