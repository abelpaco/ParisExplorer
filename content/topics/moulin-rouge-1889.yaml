fr:
  title: "1889 : Paris inaugure une tour… et un faux moulin"
  subtitle: "Le moulin rouge n'a jamais rien moulu — et c'est tout le génie"
  narration: |
    En 1889, Paris inaugure deux monuments. Le premier est une tour de fer que le monde entier vient admirer. Le second est un faux moulin.
    Le 6 octobre 1889, la même année que la tour Eiffel, le Moulin Rouge ouvre ses portes au pied de Montmartre. Ses fondateurs s'appellent Joseph Oller et Charles Zidler. Leur idée est simple, et parfaitement assumée : construire un moulin qui ne moudra jamais rien.
    Car le moulin rouge posé sur le toit est un pur décor. Pas de meule, pas de grain, pas de farine. Juste des ailes qui tournent pour attirer l'œil. Un clin d'œil, aussi, aux vrais moulins de Montmartre, ceux de la butte, juste au-dessus. Eux ont travaillé pour de vrai. Celui-ci ne travaillera jamais. Il fera mieux : il deviendra plus célèbre que tous les autres réunis.
    Le décor ne s'arrête pas au toit. Dans le jardin trône un éléphant géant en stuc, récupéré de l'Exposition de 1889. Et cet éléphant se visite. On monte dans son ventre, et dans ce ventre, on donne des spectacles. Voilà le Paris de 1889 : une ville où l'on entre dans un éléphant pour aller voir un show.
    Sur scène, une danse de bal indisciplinée, le « chahut », est codifiée en véritable spectacle. Le monde entier le connaîtra sous un autre nom : le cancan. Deux artistes en deviennent les premières vedettes : La Goulue et Valentin le Désossé. Dans la salle, un petit homme observe tout. Il s'appelle Henri de Toulouse-Lautrec. À partir de 1891, ses affiches immortalisent le Moulin Rouge, ses danseurs et ses nuits. Ces images feront le tour du monde. Elles le font encore.
    En 1915, l'établissement brûle. L'histoire pourrait s'arrêter là. Elle ne s'arrête pas : le Moulin Rouge est reconstruit. Et il danse toujours, plus d'un siècle plus tard.
    Voilà peut-être la vraie morale de 1889. Cette année-là, Paris a inauguré une tour de fer devenue l'emblème de la ville, et un moulin de décor qui n'a jamais moulu un seul grain. Les deux sont toujours debout. La tour avait un ingénieur de génie. Le moulin, lui, n'avait qu'une promesse : faire tourner ses ailes pour faire tourner les têtes. Plus de cent trente ans après, elles tournent encore.
  tags: [Moulin Rouge, Montmartre, cancan, Toulouse-Lautrec, 1889, Paris]
