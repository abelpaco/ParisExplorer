en:
  title: "An Invisible Line Cuts Paris in Two"
  subtitle: "The 135 Arago medallions: the meridian that lost to Greenwich"
  narration: |
    An invisible line runs through Paris from north to south. To see it, you have to look down.

    A hundred and thirty-five bronze medallions, each about the size of a palm, are set into the sidewalks, courtyards, and cobblestones of the city. Every one carries a single word: ARAGO, flanked by an N and an S. North, south. Strung together, they trace a perfectly straight line more than nine kilometers long, from Porte de Montmartre down to the Cité universitaire, passing through the Louvre and the Jardin du Luxembourg on the way.

    That line is the Paris meridian. First traced starting in 1667, the year the Royal Observatory was founded, it served as the reference point for the scientific world for two centuries. Scholars used it to measure the Earth, to define the meter, and every map of France was aligned to it.

    Then came the showdown. By the late nineteenth century, every major power wanted the world's zero-degree meridian to run through its own capital. In 1884, an international conference in Washington settled the matter: Greenwich would win, backed by British naval power. France, offended, abstained from the vote — and kept running on Paris time for decades afterward, out of sheer pride, before quietly falling in line.

    The Paris meridian might have faded from memory entirely. In 1994, a Dutch artist, Jan Dibbets, gave it a monument turned inside out: instead of a statue, a scattered constellation of medallions set into the ground, honoring François Arago, the astronomer who had extended the meridian's measurement all the way to the Balearic Islands.

    Since then, the line has taken on a second life. A famous mystery novel turned it into a fictional "Rose Line" leading to a secret buried beneath the Louvre — and tourists from around the world now hunt down the medallions, while a few less scrupulous collectors have been known to pry them loose.

    Look for the word ARAGO under your feet. You're standing on what was once the center of the world.
