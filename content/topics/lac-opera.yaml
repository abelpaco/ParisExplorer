en:
  title: "There's a Lake Under the Paris Opera House"
  subtitle: "The hidden tank beneath Palais Garnier — and the real setting of the Phantom"
  narration: |
    There's a lake under the Paris Opera House. A real one. Black water, a vaulted ceiling, and divers who train in it.

    When Charles Garnier starts building his opera house in 1861, the site quickly turns into a nightmare. The ground underneath is soaked with water. The water table keeps rising, pumps run day and night, and nothing works.

    So Garnier flips the problem around. If the water won't leave, he'll trap it. Beneath the foundations, he has a massive watertight tank built, a double shell of concrete and bitumen. The trapped water stops pushing against anything. Its weight stabilizes the whole structure, and the water table is held in check. The stone giant — 11,000 square meters, the largest theater of its time — can now rise above it.

    That tank is still there, still full of water. You reach it through the basement levels, several floors beneath the stage. The water is cold, dark, oddly clear when you shine a light on it. And it still serves a purpose: it's an emergency water reserve in case of fire, and divers from the Paris fire brigade come here to train, in the dark, under one of the most gilded monuments in the city.

    In 1910, a novelist gets hold of the place. Gaston Leroux, a former reporter, publishes "The Phantom of the Opera": a masked figure haunts the basement of Palais Garnier and crosses an underground lake by boat. The novel goes on to become one of the most performed musicals in the world. Millions of viewers assume it's pure fiction. The lake, though, is very real.

    So there are really two opera houses in Paris. One made of gold, box seats, and the grand staircase. And, ten meters below, a silent sheet of water carrying the whole thing on its back.
