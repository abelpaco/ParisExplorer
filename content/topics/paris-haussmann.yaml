fr:
  title: "Comment Paris a été redessiné en dix-sept ans"
  subtitle: "Haussmann, Napoléon III et la ville que nous habitons encore"
  narration: |
    En 1853, Napoléon III reçoit son nouveau préfet de la Seine et lui montre une
    carte de Paris. Dessus, des traits de couleur. Des rues qui n'existent pas
    encore.

    L'homme s'appelle Georges-Eugène Haussmann. Il n'est ni architecte ni
    ingénieur. C'est un administrateur, avec un vrai talent pour trouver de
    l'argent et pour passer en force. Il restera près de dix-sept ans.

    Le Paris qu'il trouve est encore largement médiéval. Des rues étroites,
    sombres, où l'on circule mal. Pas de réseau d'égouts digne de ce nom. L'eau
    de boisson vient de la Seine, c'est-à-dire de l'endroit exact où l'on jette
    les déchets. Le choléra a frappé en 1832, puis de nouveau en 1849. Des
    milliers de morts. La question n'est donc pas esthétique. Elle est vitale.

    Alors on perce. Le boulevard de Sébastopol, le boulevard Saint-Michel : une
    grande croisée nord-sud et est-ouest, taillée à travers le tissu existant.
    L'avenue de l'Opéra. Douze avenues rayonnant autour de l'Arc de Triomphe.
    Pour ouvrir ces axes, il faut démolir. Des dizaines de milliers de logements
    disparaissent, et l'île de la Cité perd presque tout son bâti ancien.

    Sous terre, le chantier est aussi spectaculaire. L'ingénieur Eugène Belgrand
    fait passer le réseau d'égouts d'une centaine de kilomètres à près de six
    cents. Il va chercher de l'eau de source loin de la ville et la ramène par
    aqueduc. Jean-Charles Alphand, lui, dessine les parcs : les Buttes-Chaumont
    sur une ancienne carrière, Montsouris, et les deux grands bois qui encadrent
    Paris.

    C'est aussi là que la ville prend son visage. La règle est simple : la
    hauteur des façades dépend de la largeur de la rue. Même pierre calcaire
    claire, mêmes alignements, balcons filants au deuxième et au cinquième étage,
    toit en pente. L'immeuble haussmannien n'est pas le style d'un architecte.
    C'est un règlement devenu paysage.

    Tout le monde n'applaudit pas. Les travaux coûtent une fortune, financée par
    des montages de plus en plus opaques. En 1868, un jeune opposant nommé Jules
    Ferry publie un pamphlet au titre moqueur : Les Comptes fantastiques
    d'Haussmann. Les loyers montent. Les ouvriers sont repoussés vers l'est et
    vers la périphérie. Le préfet est démis de ses fonctions en janvier 1870.

    Baudelaire, lui, avait déjà tout résumé : « la forme d'une ville change plus
    vite, hélas, que le cœur d'un mortel ».

    Nous marchons encore dans ses lignes droites.
