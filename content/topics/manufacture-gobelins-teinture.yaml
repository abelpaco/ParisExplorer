en:
  title: "A Family of Dyers Gave Its Name to an Entire Paris Neighborhood"
  subtitle: "The Gobelins, from scarlet red to royal tapestries"
  narration: |
    A Paris neighborhood has carried the name of a family of dyers for over five hundred years. In the fifteenth century, Jean Gobelin settles on the banks of the Bievre, a small river now buried beneath Paris. There, he discovers a scarlet dye of exceptional quality, made possible by the river's unusual waters, rich in certain minerals.

    The family business thrives for more than a century. The Gobelins become famous across Paris for their red fabrics. Eventually, the family name comes to designate the neighborhood itself, stretched along the Bievre, in what is now the thirteenth arrondissement.

    The turning point comes in 1662. Colbert, minister to Louis the Fourteenth, buys the workshops on the king's behalf. The goal is as much political as economic: build a royal manufactory able to produce furniture, tapestries, and luxury goods to furnish Versailles and the other royal residences, without relying on foreign imports. Charles Le Brun, the king's first painter, takes over as artistic director.

    The Manufacture des Gobelins becomes something unlike anywhere else: several hundred craftsmen, painters, weavers, and gilders, working together under one roof to produce the most prestigious tapestries in Europe. Some pieces take several weavers multiple years to finish a single monumental tapestry.

    The manufactory survives the Revolution, the Empire, and the successive Republics, all the while continuing to produce work for the French state. It still exists today, on rue Berbier-du-Mets, still run by the Ministry of Culture, still faithful to the seventeenth-century hand-weaving techniques. The Gobelins neighborhood, meanwhile, has kept the name of a family of dyers whose story almost no one remembers anymore.
