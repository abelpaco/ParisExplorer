en:
  title: "Did Russian Soldiers Give Paris the Word Bistrot Back in 1814?"
  subtitle: "A charming word origin story that history can't quite confirm"
  narration: |
    One of the most everyday words in Paris may trace back to foreign soldiers occupying the city. In March 1814, after Napoleon's defeat, Russian troops march into Paris. Cossacks camp out on the Champs-Elysees, patrol the streets. Legend has it they burst into cafes shouting "bystro, bystro," Russian for "quick," desperate to get served before heading back to duty.

    It's a great story. It's been circulating since the early twentieth century, repeated in guidebooks, documentaries, and bar-counter chats. The trouble is, serious linguists find it shaky at best. The word "bistrot" doesn't show up in written French until 1884, seventy years after the Russian occupation. That gap makes a direct link hard to believe.

    Other theories exist too. The word might come from "bistouille," a mix of alcohol and coffee drunk in northern France. It could also derive from "bistraud," a regional term from Poitou for a servant or small wine merchant. None of these leads has been proven for certain either.

    What's certain is that the word settles firmly into French by the late nineteenth century, naming those small, unpretentious cafe-restaurants popping up across Paris, with their zinc counters, tightly packed tables, and chalkboard menu of the day.

    The Cossack origin will likely remain a good story rather than an established fact. But it says something true about Paris: the city has always loved telling itself legends, especially ones that turn an invasion into a bar-counter anecdote.
  tags:
