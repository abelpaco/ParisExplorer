fr:
  title: "La plus célèbre New-Yorkaise est une Parisienne"
  subtitle: "La géante de cuivre a d'abord dépassé les toits du 17e arrondissement"
  narration: |
    La plus célèbre silhouette de New York est née à Paris.
    Dans les années 1880, une géante de cuivre dépasse des toits du 17e arrondissement. Ce n'est pas un mirage. C'est un chantier. Auguste Bartholdi a conçu une statue colossale, et elle prend forme en plein Paris, dans les ateliers Gaget-Gauthier. Sa structure interne porte la signature d'un ingénieur nommé Eiffel. Oui, celui-là.
    Pendant des mois, les Parisiens vivent avec elle. On lève les yeux dans la rue, et la Liberté dépasse des immeubles. On visite même le chantier, comme on irait voir une attraction. La statue la plus américaine du monde est alors une curiosité parisienne. Une voisine encombrante que tout un quartier regarde grandir, semaine après semaine.
    Puis vient le départ. En 1885, la géante est démontée et rangée dans 214 caisses. Direction New York. Paris a construit la Liberté. L'Amérique va la dresser face à l'océan.
    Mais Paris n'a pas tout rendu.
    Sur l'île aux Cygnes, une étroite bande de terre posée sur la Seine, se dresse une statue de la Liberté de 11,5 mètres. Elle a été offerte en 1889 par la communauté américaine de Paris. Un cadeau en retour, en somme : vous nous avez donné la grande, voici la petite. Depuis l'Exposition de 1937, elle est tournée vers l'ouest. Vers sa grande sœur. Les deux statues se font face, séparées par un océan, alignées par le regard.
    Et ce n'est pas la seule. Au jardin du Luxembourg, un modèle de la statue veille sur les promeneurs. Au musée d'Orsay, un autre encore. Paris est semé de Libertés, comme autant d'épreuves d'artiste conservées près de l'atelier d'origine. La ville qui a fabriqué la statue en a gardé des exemplaires, discrets, presque confidentiels. La plupart des passants ne les remarquent même plus.
    Alors, la prochaine fois que la statue de la Liberté apparaîtra sur une photo de New York, souvenez-vous de ceci. Avant de dominer une baie américaine, cette géante a dominé des toits parisiens. Des passants l'ont vue naître, grandir, puis partir, caisse après caisse. La plus célèbre New-Yorkaise du monde est une expatriée. Et sur la Seine, une petite sœur de 11,5 mètres la salue, tournée vers l'ouest, fidèle au poste depuis 1937.
  tags: [statue de la Liberté, Bartholdi, île aux Cygnes, Eiffel, Paris, découverte]
