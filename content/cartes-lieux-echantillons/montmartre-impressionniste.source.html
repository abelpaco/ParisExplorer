<script>
const NS='http://www.w3.org/2000/svg';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=mulberry32(20260814);
function g(id){return document.getElementById(id);}
function dab(parent,x,y,ang,len,w,color,op){
  const a=ang*Math.PI/180,dx=Math.cos(a)*len/2,dy=Math.sin(a)*len/2;
  const l=document.createElementNS(NS,'line');
  l.setAttribute('x1',(x-dx).toFixed(1));l.setAttribute('y1',(y-dy).toFixed(1));
  l.setAttribute('x2',(x+dx).toFixed(1));l.setAttribute('y2',(y+dy).toFixed(1));
  l.setAttribute('stroke',color);l.setAttribute('stroke-width',w.toFixed(1));
  l.setAttribute('stroke-linecap','round');l.setAttribute('opacity',op.toFixed(2));
  parent.appendChild(l);
}
function blob(parent,x,y,rx,ry,color,op,rot){
  const e=document.createElementNS(NS,'ellipse');
  e.setAttribute('cx',x.toFixed(1));e.setAttribute('cy',y.toFixed(1));
  e.setAttribute('rx',rx.toFixed(1));e.setAttribute('ry',ry.toFixed(1));
  e.setAttribute('fill',color);e.setAttribute('opacity',op.toFixed(2));
  if(rot)e.setAttribute('transform','rotate('+rot.toFixed(1)+' '+x.toFixed(1)+' '+y.toFixed(1)+')');
  parent.appendChild(e);
}
function pick(arr){return arr[Math.floor(R()*arr.length)];}
function poly(parent,pts,color,op){
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d','M'+pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')+'Z');
  p.setAttribute('fill',color);if(op!==undefined)p.setAttribute('opacity',op);
  parent.appendChild(p);return p;
}

/* ---------- SKY ---------- */
(function(){
  const sky=g('skyDabs');
  const cold=['#8ea0b8','#97a8bd','#a5b2c4','#b3bccb'];
  const mid=['#bcc4d0','#c8ccd4','#d2d4d8','#c4c3c6'];
  const warm=['#ddd8cc','#e4ddcd','#d8d2c4','#e9e2d2'];
  for(let i=0;i<1350;i++){
    const x=R()*1080, y=Math.pow(R(),1.1)*780;
    const t=y/780;
    let c; const r=R();
    if(t<0.4) c = r<0.75?pick(cold):pick(mid);
    else if(t<0.72) c = r<0.6?pick(mid):(r<0.85?pick(cold):pick(warm));
    else c = r<0.75?pick(warm):pick(mid);
    dab(sky,x,y,(R()-0.5)*20,30+R()*48,7+R()*7,c,0.35+R()*0.4);
  }
  const clouds=[[210,140,180],[720,110,150],[480,260,130],[900,300,120],[150,380,110],[620,430,90]];
  for(const [cx,cy,rr] of clouds){
    for(let i=0;i<60;i++){
      const a=R()*6.283, d=Math.sqrt(R())*rr;
      dab(sky,cx+Math.cos(a)*d*1.6,cy+Math.sin(a)*d*0.55,(R()-0.5)*14,32+R()*48,9+R()*6,pick(['#dfe0e2','#e8e6e0','#d4d6da','#eeeae0']),0.3+R()*0.35);
