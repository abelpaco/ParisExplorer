fr:
  title: "Le PSG est né d'une collecte : vingt mille Parisiens ont payé"
  subtitle: "1970 : une souscription, une fusion, une trahison — et un club"
  narration: |
    En 1970, Paris est une anomalie. Londres a Arsenal, Chelsea et Tottenham.
    Madrid a le Real et l'Atlético. Milan en a deux. Paris, capitale de six
    millions d'habitants, n'a plus un seul club en première division.

    Le Racing a abandonné le professionnalisme. Le Red Star s'est enfoncé.
    Dans les tribunes, une question circule : comment la Ville Lumière
    peut-elle être éteinte le samedi soir ?

    La réponse ne viendra ni d'un mécène ni d'une mairie. Elle viendra d'une
    souscription. Des dirigeants du football français lancent un appel public :
    donnez, et Paris aura son grand club. Vingt mille personnes signent. Des
    commerçants, des employés, des gamins qui envoient leurs économies. C'est,
    à l'époque, unique en Europe : un grand club fondé par ses futurs
    supporters, avant même d'exister.

    Reste à exister sportivement. Plutôt que de partir de zéro, le club né de
    la souscription fusionne avec le Stade Saint-Germain, un club de banlieue
    fondé en 1904, qui joue alors en deuxième division. Le douze août 1970, le
    Paris Saint-Germain est officiellement créé. Paris apporte le nom et
    l'argent. Saint-Germain apporte l'équipe, et un terrain d'entraînement :
    le camp des Loges, que le club n'a jamais quitté.

    La première saison est un conte de fées : le PSG monte en première
    division dès 1971. Puis tout se déchire. La mairie de Paris veut financer
    un club qui porte le nom de Paris, et rien d'autre. En 1972, le club est
    coupé en deux. Le Paris FC garde la place en première division, les
    joueurs professionnels et les subventions. Le PSG garde son nom, son
    histoire — et repart en troisième division, chez les amateurs.

    Ce sera la meilleure chose qui lui soit arrivée. Reconstruit depuis la
    base, porté ensuite par Daniel Hechter puis Francis Borelli, le club
    remonte en deux saisons et s'installe au Parc des Princes en 1974 —
    l'année, précisément, où le Paris FC descend. Les deux trajectoires se
    croisent cette saison-là, et mettront un demi-siècle à se recroiser.

    Cinquante ans plus tard, le club fondé par vingt mille anonymes a rempli
    le Parc, gagné des titres par dizaines, et soulevé la Ligue des champions.
    Tout a commencé par une liste de souscripteurs. Les grandes histoires de
    football commencent rarement dans un bureau : celle-ci commence par des
    mandats postaux.
