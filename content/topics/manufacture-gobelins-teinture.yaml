fr:
  title: Une famille de teinturiers a donne son nom a un quartier entier de Paris
  subtitle: Les Gobelins, du rouge ecarlate aux tapisseries royales
  narration: 'Un quartier parisien porte le nom d''une famille de teinturiers depuis
    plus de cinq cents ans. Au quinzieme siecle, Jean Gobelin s''installe au bord
    de la Bievre, cette petite riviere aujourd''hui enterree sous Paris. Il y decouvre
    une teinture ecarlate d''une qualite exceptionnelle, obtenue grace aux eaux particulieres
    de la riviere, chargees de certains mineraux.


    L''affaire familiale prospere pendant plus d''un siecle. Les Gobelins deviennent
    celebres dans tout Paris pour leurs etoffes rouges. Le nom de famille finit par
    designer directement le quartier ou ils travaillent, le long de la Bievre, dans
    le treizieme arrondissement actuel.


    Le tournant survient en 1662. Colbert, ministre de Louis XIV, rachete les ateliers
    pour le compte du roi. L''objectif est politique autant qu''economique : creer
    une manufacture royale capable de produire meubles, tapisseries et objets de luxe
    pour equiper Versailles et les autres residences royales, sans dependre des importations
    etrangeres. Charles Le Brun, premier peintre du roi, en prend la direction artistique.


    La Manufacture des Gobelins devient alors un lieu unique : plusieurs centaines
    d''artisans, peintres, tisserands, doreurs, travaillent ensemble sous un meme
    toit pour produire les tapisseries les plus prestigieuses d''Europe. Certaines
    pieces demandent plusieurs annees de travail a plusieurs tisserands pour une seule
    tapisserie monumentale.


    La manufacture traverse la Revolution, l''Empire, les Republiques successives,
    en continuant de produire pour l''Etat francais. Elle existe encore aujourd''hui,
    rue Berbier-du-Mets, toujours geree par le ministere de la Culture, toujours fidele
    aux techniques de tissage a la main du dix-septieme siecle. Le quartier des Gobelins,
    lui, a garde le nom d''une famille de teinturiers dont personne, ou presque, ne
    connait plus l''histoire.

    '
  tags:
  - gobelins
  - artisanat
  - louis xiv
  cards:
  - Au quinzieme siecle, la famille Gobelin decouvre une teinture rouge exceptionnelle
    grace aux eaux de la Bievre.
  - En 1662, Colbert rachete les ateliers pour Louis XIV et cree la Manufacture royale
    des Gobelins.
  - La manufacture existe encore aujourd'hui, produisant des tapisseries a la main
    selon des techniques du dix-septieme siecle.
