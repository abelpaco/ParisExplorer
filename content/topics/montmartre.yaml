    - "Balade parisienne"

en:
  title: "Montmartre: The Hill That Never Quite Joined Paris"
  subtitle: "Plaster, windmills, painters and a vineyard in the middle of the city"
  narration: |
    There is a hill in Paris where people still bring in a grape harvest.

    Montmartre rises to a little over a hundred and thirty metres. That makes it
    the highest natural point in the city. Anywhere else it would be a bump. In a
    capital built on a plain, it is an event.

    Where does the name come from? There are two candidates, and historians have
    never settled it. Mons Martis, the mount of Mars, after a Roman temple. Or
    mons Martyrum, the mount of martyrs, for Denis, the first bishop of Paris,
    beheaded on these slopes according to tradition. Legend adds that he picked
    up his own head and kept walking. It does not help decide, but it sticks.

    For centuries the hill was a working place. The ground underneath is full of
    gypsum. You dig it, you fire it, you get plaster: the original plaster of
    Paris. Windmills along the ridge ground stone and grain. Two of them are
    still standing.

    Until 1860, Montmartre was not Paris. It was an independent village, outside
    the customs wall and therefore outside the tax on wine. Drinking was simply
    cheaper up here. The open-air taverns filled up. When Napoleon III annexed
    the village, the city inherited a district of low rents and badly heated
    studios.

    So the painters climbed the hill. Renoir set up his easel at the Moulin de la
    Galette in 1876. Van Gogh lodged on the rue Lepic with his brother Theo. And
    in a rickety wooden building nicknamed the Bateau-Lavoir, a Spaniard of
    twenty-five painted a canvas in 1907 that would break European painting
    wide open: Picasso, and his Demoiselles d'Avignon.

    In between, the hill bled. On the eighteenth of March 1871, the army came to
    seize the cannons parked on the summit. A crowd blocked them. The Paris
    Commune began there, that morning.

    The Sacré-Cœur grew partly out of that wound. Begun in 1875, the basilica was
    not finished until 1914. Its stone has one unusual property: rain makes it
    whiter. The building washes itself.

    And the vineyard? It was planted in 1933 on a plot that developers wanted.
    The harvest is tiny, and it is celebrated every autumn.

    A village that refused to come down the hill. That may be the best definition
    of Montmartre.
