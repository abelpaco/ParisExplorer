en:
  title: "The World's Biggest Flea Market Began With Parisians Dumping Their Own Trash"
  subtitle: "How the ragpickers of Paris invented Saint-Ouen"
  narration: |
    A market visited by millions of people every year began as a sanitary eviction. In the 1860s, Paris wants to get rid of the ragpickers, poor workers who collect and resell waste, broken objects, fabric, scrap metal found in the streets of the capital. Haussmann is modernizing Paris, and these activities, seen as filthy and disorderly, have no place among the new boulevards.

    The authorities push the ragpickers out beyond the city limits, past the fortifications, into a stretch of unbuildable land between Paris and the town of Saint-Ouen. There, with no plan and no official permission, an informal market takes shape, selling everything: broken furniture, worn-out clothes, salvaged trinkets.

    The name "puces", French for fleas, most likely comes from the parasites found in the old fabrics and mattresses sold there. The phrase "marche aux puces", flea market, is already in use in Paris by the nineteenth century to describe this kind of secondhand trade.

    The Saint-Ouen market gradually takes shape. In 1885, a businessman named Romain Vernaison sets up one of the first covered markets on the site. It still exists today under the name Marche Vernaison. Other markets follow over the decades: Biron, Malik, Dauphine, each with its own specialty, from antique furniture to vintage clothing.

    Today, the Puces de Saint-Ouen cover several hectares, bringing together around fifteen separate markets and several thousand vendors. Antique dealers work side by side with sellers of old vinyl records. What was once a dumping ground for the poorest people in Paris has become an international destination for wealthy collectors and tourists.
