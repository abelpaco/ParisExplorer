en:
  title: "The House of an 'Immortal', Still Standing Since 1407"
  subtitle: "51 Rue de Montmorency: Paris's oldest house and the legend of Flamel"
  narration: |
    Paris's oldest house was built by a man legend says never died.

    At 51 Rue de Montmorency, in the third arrondissement, a stone
    facade carries a date: 1407. It's the oldest house in the capital.
    Its builder was named Nicolas Flamel.

    If that name rings a bell, there's a reason: in Harry Potter, he's
    the alchemist, friend of Dumbledore, keeper of the philosopher's stone.
    But Flamel isn't a fictional character. He was a very real Parisian
    from the fourteenth century: a scrivener and bookseller, based near
    the church of Saint-Jacques-la-Boucherie, of which only the tower
    remains today — the Tour Saint-Jacques.

    Flamel was, above all, strangely wealthy. With his wife Pernelle, he
    funded chapels, hospitals, church portals. And this house on Rue de
    Montmorency wasn't built for himself: it was a shelter for the poor.
    Carved into the facade, an inscription asks its occupants, in exchange
    for a roof, to say a daily prayer for the dead.

    Where did all that money come from? Probably a solid business and a
    good marriage. But by the following century, another explanation was
    circulating: Flamel had supposedly cracked the secret of the
    philosopher's stone, the one that turns lead into gold and grants
    eternal life. Alchemy manuals appeared under his name, long after his
    death. Treasure hunters searched his houses for hidden gold. Some swore
    they'd seen him, very much alive, centuries later.

    Flamel officially died in 1418. His tombstone, which he had carved
    himself, now sits in the Musée de Cluny.

    His house, though, never closed: six centuries later, it's still
    serving meals. Paris's oldest address remains an open table —
    immortality, perhaps, was that simple.
