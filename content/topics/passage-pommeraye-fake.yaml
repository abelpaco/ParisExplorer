en:
  title: "Before Malls Existed, Paris Already Invented Shopping Under Glass"
  subtitle: "Covered passages, the first temples of consumption"
  narration: |
    Parisians have been shopping rain-free for more than two hundred years. Before Haussmann's grand boulevards, before the department stores, Paris invents the covered passage. The first one, Passage des Panoramas, opens in 1799.

    The idea is simple and new: a narrow street, capped by a glass roof, lined with shops on both sides. People walk there dry-shod, stroll in the evening thanks to gaslight, and window-shop without worrying about carriages or mud on the real streets outside.

    Between 1800 and 1850, Paris builds more than a hundred and fifty of them. Galerie Vivienne opens in 1823 with its mosaics and columns. Passage Jouffroy follows in 1846, one of the first with underfloor heating. These galleries become meeting spots, trading grounds, sometimes venues for quieter pleasures. Balzac sets whole scenes of his novels there. Walter Benjamin will later study them as the first cathedrals of merchandise.

    Then comes the fall. Haussmann cuts wide, tree-lined, well-lit boulevards through the city in the 1850s and 1860s. Broad sidewalks outshine the appeal of narrow passages. Many galleries close, get demolished, or simply fade into neglect. Of the hundred and fifty passages standing at the start of the century, only about twenty survive today.

    The ones that remain, Galerie Vivienne, Passage des Panoramas, Passage Jouffroy, are now listed as historic monuments, restored, and filled with tourists chasing old Paris. What nobody tells them is that these galleries were never quaint to begin with. In 1820, they were the equivalent of an ultramodern shopping mall.
