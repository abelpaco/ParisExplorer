en:
  title: "1870: The Winter Paris Ate the Zoo's Elephants"
  subtitle: "September 19, 1870: the siege begins — four months under blockade"
  narration: |
    One winter, Parisians ate the elephants from the zoo. This isn't a
    legend. It happened a century and a half ago.

    On September 19, 1870, Prussian troops close the ring around Paris.
    War was declared in July, the Empire collapsed at Sedan, the
    Republic has just been proclaimed. Only the capital remains: two
    million people, ancient walls, and not a single road left open.

    The siege will last more than four months.

    To reach the outside world, Paris improvises. Manned balloons
    rise above enemy lines: around sixty will fly out, carrying mail
    and even the minister Gambetta, who escapes in early October to
    organize resistance from the provinces. Coming the other way,
    homing pigeons bring back messages photographed in miniature —
    thousands of dispatches squeezed onto a single strip of film.

    Then hunger sets in. Horses go first. Then cats, dogs, and rats,
    sold by the piece at market stalls. Restaurants post surreal
    menus. In December, the Jardin d'Acclimatation, the city's zoo,
    gives in and sells off its animals: antelopes, camels, and its
    two elephants, Castor and Pollux, slaughtered and butchered. On
    New Year's Eve, one fashionable Parisian table serves elephant
    consommé.

    The cold makes things worse: that winter is one of the harshest
    of the century. The Seine carries drifting ice, people burn their
    furniture for warmth. In January, Prussian shells start falling on
    the Left Bank.

    On January 28, 1871, Paris surrenders. The armistice is signed.
    But the story doesn't end there: two months later, the starved
    and humiliated city rises up. That will become the Commune — but
    that's another story.

    What remains of the siege are restaurant menus now traded as
    curiosities, photographs of the old walls, and one certainty:
    you can cut Paris off from the world, but you can't stop it from
    inventing.
