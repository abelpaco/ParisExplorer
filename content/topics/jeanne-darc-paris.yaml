    - "La Jeanne d'Arc dorée de la place des Pyramides marque l'endroit exact de l'assaut — l'emplacement d'une défaite, pas d'une victoire."

en:
  title: "The Day Joan of Arc Lost — It Happened in Paris"
  subtitle: "September 8, 1429: the failed assault on the Porte Saint-Honoré"
  narration: |
    Joan of Arc lost one battle. Just one. It happened here, in Paris.

    On September 8, 1429, she arrives at the city walls with the royal army. Paris isn't in French hands: the city is held by the Burgundians, allies of the English. Four months earlier, Joan freed Orléans. Two months earlier, she saw Charles VII crowned at Reims. Everything seems possible.

    The target is the Porte Saint-Honoré, a city gate. Today, the spot sits in the first arrondissement, steps from the Louvre. Back then, it marked the edge of the city: a wall, a wide ditch, and defenders determined to hold the line.

    Joan climbs down into the ditch, tests the water's depth with her lance, calls for the crossing to be filled in under enemy fire. That's when a crossbow bolt pierces her thigh. She refuses to leave the field. She wants to push the assault through nightfall. She's carried off almost by force.

    The next day, she wants to attack again. But the order comes down: retreat. Charles VII, secretly negotiating with Burgundy, chooses to break camp. The army pulls back. Paris won't fall. Joan will never set foot there again in armor.

    What follows is darker. Eight months later, she's captured at Compiègne. Then sold, tried, burned at Rouen in 1431. Paris itself won't return to French hands until 1436 — without her.

    The city has kept the memory of that day, in its own way. At Place des Pyramides, a few steps from where the assault took place, a golden Joan of Arc has raised her banner since 1874. It's one of the most photographed statues in Paris. Few of those taking pictures know it marks the site of a defeat.

    And September 8 wasn't just any date: it's the feast of the Nativity of the Virgin Mary. Attacking on that day was later held against Joan, all the way through her trial.

    An unconquerable city, a wound, an order to retreat. The one time the legend bent — it was in front of Paris.
