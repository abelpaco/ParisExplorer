fr:
  title: Avant les centres commerciaux, Paris avait deja invente le shopping sous
    verre
  subtitle: Les passages couverts, premiers temples de la consommation
  narration: 'On peut faire ses courses a l''abri de la pluie a Paris depuis plus
    de deux cents ans. Avant les grands boulevards d''Haussmann, avant les grands
    magasins, les Parisiens inventent les passages couverts. Le premier, le Passage
    des Panoramas, ouvre en 1799.


    Le principe est simple et neuf : une rue etroite, fermee par une verriere, bordee
    de boutiques des deux cotes. On y marche au sec, on y flane le soir grace au gaz,
    on y regarde les vitrines sans se soucier des calèches et de la boue des vraies
    rues.


    Entre 1800 et 1850, Paris en compte plus de cent cinquante. La Galerie Vivienne
    ouvre en 1823 avec ses mosaiques et ses colonnes ; le Passage Jouffroy suit en
    1846, l''un des premiers a etre chauffe au sol. Ces galeries deviennent des lieux
    de rendez-vous, de commerce, parfois de plaisirs plus discrets. Balzac y situe
    des scenes entieres de ses romans, Walter Benjamin les etudiera plus tard comme
    les premieres cathedrales de la marchandise.


    Puis vient la chute. Haussmann perce de larges boulevards eclaires et arbores
    dans les annees 1850 et 1860. Les larges trottoirs remplacent l''interet des passages
    etroits. Beaucoup de galeries ferment, sont demolies, tombent en desuetude. Sur
    les cent cinquante passages du debut du siecle, une vingtaine seulement survivent
    aujourd''hui.


    Ceux qui restent, la Galerie Vivienne, le Passage des Panoramas, le Passage Jouffroy,
    sont desormais classes, restaures, frequentes par les touristes qui cherchent
    l''ancien Paris. Ce que personne ne leur dit, c''est que ces galeries n''ont rien
    de pittoresque a l''origine : elles etaient l''equivalent, en 1820, d''un centre
    commercial ultramoderne.

    '
