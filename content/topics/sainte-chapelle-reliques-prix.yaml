en:
  title: "King Louis IX Paid More for a Crown of Thorns Than for the Chapel That Housed It"
  subtitle: "The staggering price of relics in the thirteenth century"
  narration: |
    A whole building goes up just to house an object that cost more than the building itself. In 1239, King Louis IX, later known as Saint Louis, buys from the Latin emperor of Constantinople a relic considered priceless: the crown of thorns said to have been worn by Christ.

    The price is staggering for the time: around one hundred thirty-five thousand livres tournois. For comparison, building the Sainte-Chapelle itself, constructed between 1242 and 1248 to hold this relic and other fragments of the Passion, costs about forty thousand livres. That's a third of what the relic alone cost.

    The Latin emperor of Constantinople, Baudouin II, was drowning in debt and chronically short of funds to defend his crumbling empire. He'd already pawned the crown to Venetian merchants. Louis IX pays off that debt and recovers the relic, which then travels from Constantinople to Paris, carried on its final stretch by the king himself, barefoot, as a gesture of humility.

    The Sainte-Chapelle is designed specifically as a setting for this object. Its upper chapel, reserved for the king and his court, is pierced by fifteen enormous stained-glass windows that turn the interior into a box of colored light, a remarkable feat for Gothic architecture. The relic itself was displayed on a raised platform, visible but out of reach.

    The crown of thorns survived the French Revolution, narrowly escaping the destruction of religious relics. Today it's kept at Notre-Dame cathedral in Paris, shown to the public on rare occasions. The Sainte-Chapelle, meanwhile, is open for visits all year round, emptied of the very object it was built to hold.
