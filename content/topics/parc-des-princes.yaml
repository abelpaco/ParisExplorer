en:
  title: "The Tour de France Finished Here for 65 Years"
  subtitle: "Parc des Princes, from velodrome to stadium"
  narration: |
    For sixty-five years, the Tour de France did not finish on the
    Champs-Élysées. It finished here, in western Paris, on a ring of concrete.

    A velodrome opened on this ground in 1897. Cycling was the sport of the age,
    and the track pulled enormous crowds. When the first Tour set off in 1903,
    this is where the riders closed their loop. They would come back every year
    until 1967.

    The name is older than any of the sport played here. Before the Revolution,
    the Parc des Princes was a royal hunting ground.

    The stadium has been rebuilt three times. The one standing today dates from
    1972. Its architect, Roger Taillibert, refused a compromise every stadium
    made back then: pillars. In a conventional ground, the roof frame rests on
    columns, and behind every column sit spectators who cannot see the pitch.

    Taillibert got rid of them. He drew some fifty great ribs of prestressed
    concrete, carrying the stands and the roof at once. The result fits in one
    sentence: from any seat in the house, you see the whole field. For its time,
    that was engineering as much as architecture.

    Four years later the same architect would sign the Olympic Stadium in
    Montreal, in the same language of curved concrete. The Parc was the
    full-scale rough draft.

    There is a second oddity, invisible from the stands. The city's ring road
    runs underneath the stadium. Thousands of cars pass beneath the crowd's feet
    every single day. The two were in fact designed together: the stadium bent
    itself around the motorway, not the other way round.

    Paris Saint-Germain was founded in 1970. The club moved in during 1974 and
    never left. Two stands ended up naming the two souls of the support:
    Boulogne and Auteuil.

    The ground has seen more than club football. In 1984, France won the
    European Championship here, beating Spain. It staged matches at the 1998
    World Cup, and again at Euro 2016.

    Capacity sits around forty-eight thousand. That is small for a club of this
    size, and it is the whole substance of the argument about its future.

    Taillibert's concrete has not moved an inch. Fifty white ribs, set on an old
    hunting ground, above a motorway.
