en:
  title: "A Famous Painter Toppled a Monumental Column, Then Paid For It With His Life"
  subtitle: "Gustave Courbet and the fall of the Colonne Vendome"
  narration: |
    A column forty-four meters tall collapses into pieces on a Parisian square, captured by photographers of the era. On May 16, 1871, in the middle of the Paris Commune, the Colonne Vendome comes crashing down in front of a huge crowd. Built under Napoleon I from bronze melted down from cannons captured at Austerlitz, the column stands to the communards as a symbol of war and military despotism.

    Gustave Courbet, the painter behind "L'Origine du monde" and "A Burial at Ornans," heads the Federation of Artists during the Commune. Back in 1870, before the uprising even began, he had proposed dismantling the column and replacing it with a monument to peace. When the Commune votes for its destruction in 1871, Courbet is there. Historians still argue over how much he actually drove the decision, and how much he simply carried it out.

    The fall itself is spectacular. The column snaps into several pieces, landing on bundles of manure laid out to cushion the impact. The statue of Napoleon at the top breaks off on its own.

    Weeks later, the Commune is crushed, and the crackdown begins. Courbet is arrested and spends six months in prison. Then, in 1873, the French state names him financially responsible for the destruction and orders him to pay for the column's complete reconstruction. The bill is staggering: roughly three hundred thousand francs, to be paid in yearly installments stretched over years.

    Courbet chooses exile over ruin. He leaves for Switzerland in 1873 and dies there in 1877, the very year his first payment is due. The column, meanwhile, rises again in exact replica by 1875, and it still stands on Place Vendome today.
