fr:
  title: Deux ans de voyage pour faire venir un obelisque de trois mille ans a Paris
  subtitle: Le calvaire logistique du cadeau de Mehemet Ali
  narration: 'Un bateau special est construit rien que pour transporter une pierre.
    En 1830, le vice-roi d''Egypte Mehemet Ali offre a la France un des deux obelisques
    du temple de Louxor. Le cadeau pese deux cent trente tonnes. Aucun navire existant
    ne peut le charger.


    L''ingenieur Apollinaire Lebas concoit un bateau a fond plat baptise le Luxor.
    Il est construit specialement au Havre, avec une proue capable de s''ouvrir pour
    laisser entrer l''obelisque couche.


    Le voyage commence en 1831. Le Luxor remonte le Nil, attend la crue pour se degager
    du sable, traverse la Mediterranee, remonte la Seine. L''operation prend plus
    de deux ans. Des equipes locales aident a degager le monument de son socle a Louxor,
    ou il est reste debout depuis plus de trois mille ans.


    L''obelisque arrive a Paris en 1833, mais il faut encore trois ans avant de trouver
    comment le dresser sans le briser. Le chantier se deroule place de la Concorde,
    sous les yeux du roi Louis-Philippe. Le 25 octobre 1836, plus de cent mille Parisiens
    assistent au levage. Des cordages, des poulies geantes et des centaines d''ouvriers
    hissent la pierre en a peine plus d''une heure, dans un silence tendu : personne
    ne sait si le monument va tenir.


    Il tient. Depuis, l''obelisque de Louxor trone place de la Concorde, exactement
    a l''endroit ou la guillotine a fonctionne pendant la Revolution. Ses hieroglyphes
    racontent le regne de Ramses II, mais presque aucun Parisien ne les lit.


    Le second obelisque du temple, lui, n''a jamais quitte l''Egypte. La France y
    a renonce en 1981, le rendant officiellement au pays qui l''avait offert un siecle
    et demi plus tot.

    '
