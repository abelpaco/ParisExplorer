en:
  title: "PSG Was Born From a Public Collection: Twenty Thousand Parisians Paid"
  subtitle: "1970: a subscription, a merger, a betrayal — and a club"
  narration: |
    In 1970, Paris was an anomaly. London had Arsenal, Chelsea and Tottenham.
    Madrid had Real and Atlético. Milan had two giants. Paris, a capital of
    six million people, no longer had a single club in the first division.

    Racing had given up professional football. Red Star had sunk down the
    tables. Around the city, one question kept coming back: how could the City
    of Light go dark on Saturday nights?

    The answer came neither from a tycoon nor from the city hall. It came from
    a subscription. A group of French football executives launched a public
    appeal: give, and Paris will have its club. Twenty thousand people signed
    up. Shopkeepers, office workers, kids sending in their savings. At the
    time it was unique in Europe: a major club founded by its future
    supporters, before it even existed.

    The club still needed a team. Rather than starting from zero, the
    subscription club merged with Stade Saint-Germain, a suburban side founded
    in 1904, then playing in the second division. On the twelfth of August
    1970, Paris Saint-Germain was officially born. Paris brought the name and
    the money. Saint-Germain brought the players, and a training ground: the
    Camp des Loges, which the club has never left.

    The first season was a fairy tale: PSG reached the first division in 1971.
    Then everything tore apart. Paris city hall would only fund a club named
    after Paris, and nothing else. In 1972 the club was split in two. Paris FC
    kept the first-division spot, the professional players and the subsidies.
    PSG kept its name, its short history — and was sent down to the third
    division, among amateurs.

    It turned out to be the best thing that ever happened to the club. Rebuilt
    from the ground up, then carried by Daniel Hechter and Francis Borelli,
    PSG climbed back in two seasons and moved into the Parc des Princes in
    1974 — the very year Paris FC went down. The two paths crossed that
    season, and took half a century to cross again.

    Fifty years on, the club founded by twenty thousand unknown names fills
    the Parc, has won trophies by the dozen, and has lifted the Champions
    League. It all started with a list of subscribers. Great football stories
    rarely begin in a boardroom: this one began with postal orders.
