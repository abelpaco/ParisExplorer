en:
  title: "1889: Paris Built a Tower — and a Fake Windmill"
  subtitle: "The red mill never ground a thing — and that was the whole point"
  narration: |
    In 1889, Paris unveils two landmarks. The first is an iron tower the whole world comes to admire. The second is a fake windmill.
    On October 6, 1889 — the same year as the Eiffel Tower — the Moulin Rouge opens its doors at the foot of Montmartre. Its founders are Joseph Oller and Charles Zidler. Their idea is simple, and entirely unapologetic: build a windmill that will never mill anything.
    Because the red mill on the roof is pure stage set. No millstone, no grain, no flour. Just sails, turning to catch the eye. It is also a wink at the real windmills of Montmartre, up on the hill just above. Those worked for a living. This one never will. It will do better: it will become more famous than all of them combined.
    The set design does not stop at the roof. In the garden stands a giant stucco elephant, salvaged from the 1889 World's Fair. And the elephant can be visited. You climb into its belly — and inside that belly, there are shows. That is Paris in 1889: a city where you step inside an elephant to watch a performance.
    On stage, a rowdy ballroom dance known as the "chahut" is codified into a true stage act. The world will come to know it by another name: the cancan. Two performers become the venue's first stars: La Goulue and Valentin le Désossé — "the Boneless." In the audience, a small man watches everything. His name is Henri de Toulouse-Lautrec. From 1891 onward, his posters immortalize the Moulin Rouge, its dancers and its nights. Those images will travel the world. They still do.
    In 1915, the building burns. The story could end there. It does not: the Moulin Rouge is rebuilt. And it is still dancing, more than a century later.
    Perhaps that is the real moral of 1889. That year, Paris unveiled an iron tower that became the city's emblem, and a decorative windmill that never milled a single grain. Both are still standing. The tower had a genius engineer. The mill had only a promise: keep the sails turning, and heads will turn too. More than a hundred and thirty years later, they are still turning.
  tags: [Moulin Rouge, Montmartre, cancan, Toulouse-Lautrec, 1889, Paris history]
