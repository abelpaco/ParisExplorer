fr:
  title: "Le Tour de France s'est terminé ici pendant 65 ans"
  subtitle: "Le Parc des Princes, du vélodrome au stade"
  narration: |
    Pendant soixante-cinq ans, le Tour de France ne s'est pas terminé sur les
    Champs-Élysées. Il se terminait ici, porte de Saint-Cloud, sur un anneau de
    béton.

    En 1897, on inaugure à cet endroit un vélodrome. Le cyclisme est alors le
    sport roi, et la piste attire des foules considérables. Dès la première
    édition du Tour, en 1903, c'est là que les coureurs bouclent leur boucle.
    Ils y reviendront chaque année jusqu'en 1967.

    Le nom du lieu est plus ancien que le sport qu'on y pratique. Avant la
    Révolution, le Parc des Princes était un domaine de chasse royal.

    Le stade a été reconstruit trois fois. Celui qu'on voit aujourd'hui date de
    1972. Son architecte, Roger Taillibert, refuse une contrainte que tous les
    stades acceptaient alors : les poteaux. Dans une enceinte classique, la
    charpente du toit repose sur des piliers, et derrière chaque pilier il y a
    des spectateurs qui ne voient pas le terrain.

    Taillibert supprime les piliers. Il dessine une cinquantaine de grandes
    nervures de béton précontraint, qui portent à la fois les gradins et la
    toiture. Le résultat tient en une phrase : de n'importe quel siège, on voit
    tout le terrain. Pour l'époque, c'est une prouesse d'ingénieur autant que
    d'architecte.

    Quatre ans plus tard, le même architecte signera le stade olympique de
    Montréal, avec la même grammaire de béton courbe. Le Parc en était le
    brouillon grandeur nature.

    Il y a une autre bizarrerie, celle-là invisible depuis les tribunes. Le
    boulevard périphérique passe sous le stade. Des milliers de voitures roulent
    chaque jour sous les pieds des spectateurs. Le stade a d'ailleurs été conçu
    en même temps que la voie rapide : l'un s'est plié à l'autre.

    Le Paris Saint-Germain naît en 1970. Il s'installe au Parc en 1974, et n'en
    est jamais reparti. Deux tribunes ont fini par donner leur nom aux deux âmes
    du public : Boulogne et Auteuil.

    Le stade a vu passer autre chose que du football de club. En 1984, l'équipe
    de France y remporte le Championnat d'Europe en battant l'Espagne. Il a
    accueilli des matchs de la Coupe du monde 1998, puis ceux de l'Euro 2016.

    Sa capacité tourne autour de quarante-huit mille places. C'est peu pour un
    club de cette dimension, et c'est tout le sujet des débats sur son avenir.

    Le béton de Taillibert, lui, n'a pas bougé. Cinquante côtes blanches, posées
    sur un ancien terrain de chasse, au-dessus d'une autoroute.
