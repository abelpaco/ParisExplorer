# ParisExplorer YouTube Automation Configuration

# Scheduling configuration
schedule:
  # Times for automated posts (24-hour format)
  post_times:
    - "09:00"  # Morning post
    - "14:00"  # Afternoon post
    - "19:00"  # Evening post
  
  # Timezone
  timezone: "Europe/Paris"
  
  # Enable/disable scheduler
  enabled: true

# Content sources configuration
content_sources:
  # Local files
  local:
    enabled: true
    path: "./content"
    # Supported formats
    video_formats: [".mp4", ".avi", ".mov", ".mkv"]
    image_formats: [".jpg", ".jpeg", ".png", ".gif"]
    text_formats: [".txt", ".md"]
  
  # External URLs
  external_urls:
    enabled: true
    # List of URLs to fetch content from
    urls: []
  
  # External API
  external_api:
    enabled: false
    # API endpoint configuration
    endpoint: ""
    auth_type: "bearer"  # Options: bearer, api_key, basic
    polling_interval: 3600  # seconds

# YouTube upload settings
youtube:
  # Default video settings
  #
  # VOLONTAIREMENT "private" : la chaine est reelle et a deja publie. Une
  # generation automatique qui part en "public" sans relecture engage l'image de
  # la chaine. On passe a "public" seulement apres avoir valide a la main un
  # premier lot de videos produites par le pipeline.
  #
  # A savoir : tant que le projet Google Cloud n'a pas passe l'audit YouTube API,
  # tout upload par l'API est de toute facon verrouille en "private", quelle que
  # soit la valeur envoyee ici.
  default_privacy: "private"  # Options: public, private, unlisted
  default_category: "19"  # Travel & Events
  
  # Default tags for Paris content
  default_tags:
    - "Paris"
    - "France"
    - "Travel"
    - "Tourism"
    - "ParisExplorer"
  
  # Add location to videos
  location:
    enabled: true
    latitude: 48.8566
    longitude: 2.3522
    description: "Paris, France"

# Content queue settings
queue:
  # Maximum queue size
  max_size: 100
  
  # Retry failed uploads
  retry_failed: true
  max_retries: 3
  
  # Archive uploaded content
  archive_uploaded: true
  archive_path: "./uploaded"

# Video creator settings
video_creator:
  # Directory for generated videos
  output_dir: "./content/videos"
  # Frames per second for generated videos
  fps: 24
  # Automatically generate a new video when the queue is empty
  auto_generate: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "./logs/automation.log"
  console: true
