en:
  title: "Paris Buried a River — It Still Flows Beneath Your Feet"
  subtitle: "The Bièvre: poisoned, condemned, covered over in 1912"
  narration: |
    Paris used to have two rivers. Only one still runs on the surface. The
    other one is still flowing — right under your feet.

    The Bièvre rises near Versailles and entered Paris from the southeast,
    near the poterne des Peupliers, an old gate in the city wall. It wound
    through what are now the thirteenth and fifth arrondissements before
    joining the Seine near the Austerlitz train station. For centuries it
    was a country river: watermills, wash-houses, maybe even beavers — one
    theory says that's where its name comes from.

    Then Paris put it to work, and that's what killed it. Tanners, leather
    dressers, and above all dyers moved onto its banks starting in the
    Middle Ages. One family of scarlet-dye specialists, the Gobelins, made
    their fortune there — the royal Gobelins manufactory, still standing
    today, carries their name. Soaking hides, dye runoff, dumped waste: the
    Bièvre turned into an open sewer. By the nineteenth century its stench
    was notorious. Public health experts wanted it gone.

    So Paris did what it does with things that bother it: it made the
    problem disappear. Section by section, the river was vaulted over,
    covered, folded into the sewer system. By 1912 the Parisian Bièvre had
    vanished from the surface entirely. No bridges, no quays — a river
    wiped off the map.

    But wiped off the map doesn't mean dead. The Bièvre still runs beneath
    the thirteenth arrondissement, channeled in the dark. Further upstream,
    in the suburbs, stretches of it have been reopened, and some banks have
    seen daylight again. Paris keeps studying what's called its
    "renaturation" — bringing the lost river back up somewhere, in a
    square, a street, a park.

    In the meantime, the clues remain: a street called rue du
    Moulin-des-Prés, a gate called poterne des Peupliers, ground markers
    tracing its old course. A city can bury a river. Forgetting it turns
    out to be harder.
