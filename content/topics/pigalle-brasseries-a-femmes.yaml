fr:
  title: Le mot bistrot viendrait peut-etre de soldats russes pressés a Paris en 1814
  subtitle: Une etymologie fascinante, mais jamais totalement prouvée
  narration: 'Un mot du quotidien parisien aurait pour origine des soldats etrangers
    qui occupent la capitale. En mars 1814, apres la defaite de Napoleon, les armees
    russes entrent dans Paris. Des cosaques campent sur les Champs-Elysees, patrouillent
    dans les rues. La legende raconte qu''ils entrent dans les cafes en criant "bystro,
    bystro", qui signifie "vite" en russe, pressès qu''ils sont d''etre servis avant
    de reprendre leur service.


    L''histoire est seduisante. Elle circule depuis le debut du vingtieme siecle,
    reprise dans des guides, des documentaires, des conversations de comptoir. Le
    probleme, c''est que les linguistes serieux la considerent comme tres incertaine.
    Le mot "bistrot" n''apparait par ecrit en francais qu''en 1884, soit soixante-dix
    ans apres l''occupation russe. Un tel delai rend la transmission directe peu credible.


    D''autres hypotheses existent. Le mot pourrait venir de "bistouille", un melange
    d''alcool et de cafe consomme dans le nord de la France. Il pourrait aussi deriver
    de "bistraud", un terme regional designant un domestique ou un petit marchand
    de vin en Poitou. Aucune de ces pistes n''est definitivement prouvee non plus.


    Ce qui est certain, en revanche, c''est que le mot s''installe durablement dans
    le francais a la fin du dix-neuvieme siecle, pour designer ces petits cafes-restaurants
    populaires qui fleurissent dans tout Paris, avec leur zinc, leurs tables serrees
    et leur ardoise du jour.


    L''origine cosaque restera sans doute a jamais une belle histoire plutot qu''un
    fait etabli. Mais elle dit quelque chose de vrai sur Paris : la ville a toujours
    aime se raconter des legendes sur elle-meme, surtout quand elles impliquent une
    invasion transformee en anecdote de comptoir.

    '
