fr:
  title: Le roi Louis IX a paye plus cher pour une couronne d'epines que pour la construire
    cette chapelle
  subtitle: L'incroyable prix des reliques au treizieme siecle
  narration: 'Un edifice entier est construit pour abriter un objet qui a coute plus
    cher que le batiment lui-meme. En 1239, le roi Louis IX, futur Saint Louis, achete
    a l''empereur latin de Constantinople une relique consideree comme inestimable
    : la couronne d''epines qui aurait ete portee par le Christ.


    Le prix est stupefiant pour l''epoque : environ cent trente-cinq mille livres
    tournois. Pour comparer, la construction de la Sainte-Chapelle elle-meme, batie
    entre 1242 et 1248 pour abriter cette relique et d''autres fragments de la Passion,
    coute environ quarante mille livres, soit trois fois moins que la relique seule.


    L''empereur latin de Constantinople, Baudouin II, criblé de dettes et en manque
    chronique de moyens pour defendre son empire affaibli, avait deja mis en gage
    la couronne aupres de marchands venitiens. Louis IX rembourse cette dette et recupere
    la relique, qui voyage ensuite depuis Constantinople jusqu''a Paris, portee sur
    les dernieres etapes par le roi lui-meme, pieds nus, en signe d''humilite.


    La Sainte-Chapelle est concue specifiquement pour cet ecrin. Sa chapelle haute,
    reservee au roi et a sa cour, est percee de quinze verrieres immenses qui transforment
    l''interieur en une boite de lumiere coloree, une prouesse architecturale pour
    l''epoque gothique. La relique elle-meme etait exposee dans une tribune surelevee,
    visible mais hors de portee.


    La couronne d''epines a traverse la Revolution francaise, echappant de justesse
    a la destruction des reliques religieuses. Elle est aujourd''hui conservee a la
    cathedrale Notre-Dame de Paris, presentee au public lors d''occasions rares. La
    Sainte-Chapelle, elle, se visite toute l''annee, vidée de l''objet pour lequel
    elle avait ete concue au depart.

    '
