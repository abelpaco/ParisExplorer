    livres tournois.
  - La Sainte-Chapelle, construite entre 1242 et 1248 pour l'abriter, a coute trois
    fois moins cher que la relique elle-meme.
  - La couronne est aujourd'hui conservee a Notre-Dame, tandis que la Sainte-Chapelle
    se visite sans son tresor d'origine.
