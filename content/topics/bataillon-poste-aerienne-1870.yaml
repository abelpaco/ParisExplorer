fr:
  title: Pendant le siege de 1870, Paris envoie son courrier par montgolfiere
  subtitle: Soixante-six ballons pour rompre l'encerclement prussien
  narration: 'Un homme politique quitte Paris assiege en montgolfiere, au-dessus des
    lignes ennemies. Le 7 octobre 1870, Leon Gambetta s''envole depuis la Place Saint-Pierre
    a Montmartre pour rejoindre Tours et organiser la resistance ailleurs en France.
    Paris est encercle par les troupes prussiennes depuis septembre, coupe de tout
    contact terrestre.


    Le probleme est simple : comment communiquer avec le reste du pays quand toutes
    les routes, tous les telegraphes sont controles par l''ennemi ? La reponse parisienne
    est aussi elegante que risquee : le ciel. Entre septembre 1870 et janvier 1871,
    soixante-six ballons a hydrogene decollent de Paris, transportant courrier, journaux,
    et parfois des passagers comme Gambetta.


    Les ballons sont fabriques dans les gares desaffectees, notamment la gare d''Orleans
    et la gare du Nord, transformees en ateliers de couture geants. Chaque vol est
    une loterie : sans moteur, les aeronautes sont a la merci du vent. Certains ballons
    atterrissent en Belgique, en Hollande, en Norvege, un finit meme sa course apres
    quinze heures de vol au-dessus de la mer.


    Pour le retour du courrier vers Paris, aucun ballon ne peut remonter le vent.
    La solution vient des pigeons voyageurs. Les messages sont photographies en tres
    petit format sur pellicule, roules dans une plume, attaches a la patte d''un pigeon
    qui repart vers la capitale assiegee. Un seul pigeon peut ainsi transporter des
    milliers de messages miniaturises.


    Le siege dure cent trente-deux jours. Il se termine par la capitulation de Paris
    fin janvier 1871. Mais l''episode reste unique dans l''histoire des communications
    : jamais avant, et jamais depuis dans les memes conditions, une ville n''a maintenu
    un lien aerien aussi systematique avec l''exterieur pendant un siege.

    '
