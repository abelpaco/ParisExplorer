en:
  title: "During the 1870 Siege, Paris Sent Its Mail by Hot-Air Balloon"
  subtitle: "Sixty-six balloons to break through the Prussian blockade"
  narration: |
    A politician escapes besieged Paris by balloon, floating right over enemy lines. On October 7, 1870, Leon Gambetta lifts off from the Place Saint-Pierre in Montmartre, bound for Tours to organize French resistance elsewhere in the country. Paris has been surrounded by Prussian troops since September, cut off from all contact by land.

    The problem is straightforward: how do you communicate with the rest of the country when every road and every telegraph line is under enemy control? The Parisian answer is as elegant as it is risky: the sky. Between September 1870 and January 1871, sixty-six hydrogen balloons lift off from Paris, carrying mail, newspapers, and sometimes passengers like Gambetta.

    The balloons are built inside disused train stations, including the Gare d'Orleans and the Gare du Nord, turned into giant sewing workshops. Every flight is a gamble. Without engines, the balloonists are entirely at the mercy of the wind. Some balloons land in Belgium, others in Holland, others in Norway. One even ends its journey after fifteen hours flying over open sea.

    Getting mail back into Paris is a different problem. No balloon can fly against the wind. The solution comes from homing pigeons. Messages are photographed at an extremely tiny scale onto film, rolled up inside a feather, and strapped to a pigeon's leg before it flies back toward the besieged capital. A single pigeon can carry thousands of miniaturized messages this way.

    The siege lasts one hundred and thirty-two days. It ends with the surrender of Paris in late January 1871. But the episode stays unique in the history of communications. Never before, and never since under the same conditions, has a city kept up such a systematic aerial link with the outside world during a siege.
