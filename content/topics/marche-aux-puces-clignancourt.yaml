fr:
  title: Le plus grand marche aux puces du monde est ne du mepris des Parisiens pour
    leurs propres ordures
  subtitle: Comment les chiffonniers de Paris ont invente Saint-Ouen
  narration: 'Un marche visite chaque annee par des millions de personnes est ne d''une
    operation d''expulsion sanitaire. Dans les annees 1860, Paris veut se debarrasser
    des chiffonniers, ces travailleurs pauvres qui collectent et revendent les dechets,
    objets casses, tissus, ferrailles trouves dans les rues de la capitale. Haussmann
    modernise Paris, et ces activites jugees insalubres et desordonnees n''ont plus
    leur place dans les nouveaux boulevards.


    Les autorites repoussent les chiffonniers hors des limites de la ville, au-dela
    des fortifications, dans une zone non constructible entre Paris et la commune
    de Saint-Ouen. C''est la que se forme, sans plan ni autorisation initiale, un
    marche informel ou l''on vend de tout : meubles casses, vetements uses, bibelots
    recuperes.


    Le nom "puces" viendrait, selon l''explication la plus repandue, des parasites
    que l''on pouvait trouver dans les vieux tissus et matelas vendus sur place. L''expression
    "marche aux puces" est deja utilisee a Paris au dix-neuvieme siecle pour designer
    ce type de commerce d''occasion.


    Le marche de Saint-Ouen se structure progressivement. En 1885, un homme d''affaires
    nomme Romain Vernaison amenage un des premiers marches couverts sur le site, qui
    existe encore aujourd''hui sous le nom de marche Vernaison. D''autres marches
    suivent au fil des decennies : Biron, Malik, Dauphine, chacun avec sa specialite,
    du meuble ancien au vetement vintage.


    Aujourd''hui, les Puces de Saint-Ouen s''etendent sur plusieurs hectares, regroupent
    une quinzaine de marches distincts et plusieurs milliers de vendeurs. Des antiquaires
    y cotoient des marchands de vieux vinyles. Ce qui etait un espace d''exclusion
    pour les plus pauvres de Paris est devenu une destination internationale pour
    collectionneurs et touristes fortunes.

    '
