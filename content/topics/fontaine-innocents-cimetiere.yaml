en:
  title: "This Renaissance Fountain Sits on Two Million Dead Bodies"
  subtitle: "Paris's oldest cemetery, buried under a public square"
  narration: |
    A sixteenth-century fountain now stands on the site of the most crowded cemetery in Paris history. The Cimetiere des Innocents operates for roughly eight hundred years, from the early Middle Ages until 1780. It serves the parishes of central Paris, in the Les Halles district.

    The problem is simple. A cemetery built for a medieval village ends up absorbing centuries of dead from an ever-growing capital. Mass graves pile on top of each other. By the eighteenth century, the ground has risen several meters, pushed up by the sheer weight of bodies. Neighborhood residents complain of a constant stench. In 1780, a cemetery wall gives way entirely, collapsing straight into the cellar of a nearby building and spilling decomposing corpses inside.

    That incident forces a drastic decision. King Louis XVI orders the cemetery shut for good. Between 1786 and 1788, millions of bones are dug up at night, hauled by cart across Paris, and dumped into old underground quarries south of the city. This is how the Catacombs are born.

    Where the cemetery once stood, the city builds a public square. The Fontaine des Innocents already existed before the cemetery was cleared. Built in 1549 by architect Pierre Lescot and sculptor Jean Goujon, it originally sat on a street corner, set flat against a wall. In 1788, it gets moved to the center of the new square and rebuilt with all four sides visible for the first time.

    Today, tourists snap photos in front of its carved nymphs, unaware they're standing exactly above ground that, for eight centuries, swallowed the dead of an entire Paris neighborhood.
