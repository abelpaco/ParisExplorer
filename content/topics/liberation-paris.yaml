fr:
  title: "Août 1944 : la semaine où Paris s'est libérée elle-même"
  subtitle: "Barricades, la Nueve, et l'ordre de destruction jamais exécuté"
  narration: |
    Le vingt-cinq août 1944, Paris se réveille libre. Mais cette liberté n'est
    pas arrivée de l'extérieur : depuis une semaine, la ville se libérait
    elle-même.

    Tout commence le quinze août, par une grève de la police parisienne. Le
    dix-neuf, les policiers grévistes occupent la préfecture. L'insurrection
    gagne les mairies, les ministères, les journaux. Les pavés ressortent des
    rues : plus de six cents barricades coupent la ville. Les insurgés ont
    très peu d'armes ; ils prennent celles de l'ennemi.

    Le plan allié, pourtant, prévoyait de contourner Paris. Une bataille de
    rue coûterait trop cher en hommes, et ravitailler deux millions et demi
    d'habitants ralentirait tout. C'est un Français, le général Leclerc,
    appuyé par de Gaulle, qui force la décision : sa deuxième division
    blindée reçoit l'ordre de foncer sur la capitale.

    Le vingt-quatre août au soir, une avant-garde se faufile par la porte
    d'Italie. Les premiers blindés qui atteignent l'Hôtel de Ville portent
    des noms étranges pour une division française : Guadalajara, Teruel,
    Madrid. Ce sont les hommes de la Nueve, une compagnie composée de
    républicains espagnols, qui se battent contre le fascisme depuis 1936.
    Cette nuit-là, les cloches de Notre-Dame sonnent pour la première fois
    depuis quatre ans.

    Le lendemain, la division entre dans Paris avec les troupes américaines.
    Les combats durent toute la journée. En fin d'après-midi, von Choltitz,
    le gouverneur militaire allemand, signe la reddition à la gare
    Montparnasse. Hitler lui avait ordonné de ne laisser à l'ennemi qu'un
    champ de ruines : les ponts minés, les monuments préparés à la
    destruction. L'ordre n'a jamais été exécuté. Lucidité d'un militaire qui
    savait la guerre perdue, ou légende qu'il a lui-même entretenue après
    coup ? Les historiens en débattent encore. Les ponts, eux, sont toujours
    debout.

    Le soir même, à l'Hôtel de Ville, de Gaulle prononce les mots restés les
    plus célèbres de sa vie : « Paris outragé, Paris brisé, Paris martyrisé,
    mais Paris libéré. » Le lendemain, il descend les Champs-Élysées à pied,
    au milieu d'une foule immense.

    La semaine a coûté des centaines de vies : insurgés, soldats de Leclerc,
    civils pris dans les combats. Quant aux Espagnols de la Nueve, entrés les
    premiers, il a fallu attendre 2015 pour qu'un jardin de l'Hôtel de Ville
    porte enfin leur nom.
